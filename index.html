<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLL・JNL球団成績</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F4F5F2;
  --ink:#131A14;
  --ink-soft:#4A554C;
  --ink-mute:#78826F;
  --accent:#C97A0F;
  --accent-ink:#5C3B0B;
  --accent-bg:#FCEBC9;
  --line:#E4E7DF;
  --line-strong:#C7CCC0;
  --win:#256B3B;
  --loss:#A83B26;
  --font-display:'Oswald',"Yu Gothic",'Hiragino Sans',sans-serif;
  --font-body:'Inter',"Yu Gothic",'Hiragino Sans',sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#101812;
    --surface:#182018;
    --surface-2:#1D261E;
    --ink:#EDEFE6;
    --ink-soft:#B4BFAD;
    --ink-mute:#7E8A79;
    --accent:#F0B429;
    --accent-ink:#3A2703;
    --accent-bg:#3A2E10;
    --line:#2A342A;
    --line-strong:#3A463A;
    --win:#5FBF7F;
    --loss:#E06A50;
  }
}
:root[data-theme="dark"]{
  --bg:#101812;
  --surface:#182018;
  --surface-2:#1D261E;
  --ink:#EDEFE6;
  --ink-soft:#B4BFAD;
  --ink-mute:#7E8A79;
  --accent:#F0B429;
  --accent-ink:#3A2703;
  --accent-bg:#3A2E10;
  --line:#2A342A;
  --line-strong:#3A463A;
  --win:#5FBF7F;
  --loss:#E06A50;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
}
::selection{background:var(--accent-bg);color:var(--accent-ink);}
a{color:inherit;}
button{font-family:inherit;}

.page{max-width:980px;margin:0 auto;padding:0 20px 80px;}

.masthead{
  padding:28px 20px 20px;
  max-width:980px;
  margin:0 auto;
}
.masthead-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.wordmark{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(26px,4vw,36px);
  letter-spacing:0.02em;
  margin:0;
  display:flex;
  align-items:baseline;
  gap:10px;
}
.wordmark .lg{color:var(--accent);}
.masthead-sub{color:var(--ink-soft);font-size:13.5px;margin:4px 0 0;}
.masthead-note{
  font-size:12.5px;color:var(--ink-mute);border-left:2px solid var(--line-strong);
  padding-left:10px;max-width:260px;
}

.tabbar{
  display:flex;gap:4px;border-bottom:1px solid var(--line);
  max-width:980px;margin:18px auto 0;padding:0 20px;
  overflow-x:auto;
}
.tabbar button{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--ink-soft);font-size:14.5px;font-weight:500;
  padding:10px 14px;cursor:pointer;white-space:nowrap;
  font-family:var(--font-display);letter-spacing:0.02em;
}
.tabbar button:hover{color:var(--ink);}
.tabbar button.active{color:var(--ink);border-bottom-color:var(--accent);}

.leaguebar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px;}
.leaguebtn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;
}
.leaguebtn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.seasonbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 22px;}
.seasonbtn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
  padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;
}
.seasonbtn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.seasonbtn .flag{font-size:11px;opacity:0.85;}

.season-heading{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;flex-wrap:wrap;}
.season-heading h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin:0;letter-spacing:0.01em;}
.season-heading .tag{
  font-size:11.5px;color:var(--loss);border:1px solid var(--loss);border-radius:6px;
  padding:2px 7px;font-weight:600;
}
.season-meta{color:var(--ink-mute);font-size:13px;margin:0 0 18px;}

table.standings{width:100%;border-collapse:collapse;font-size:14px;}
table.standings th{
  text-align:left;font-size:11.5px;color:var(--ink-mute);font-weight:500;
  padding:0 10px 8px;border-bottom:1px solid var(--line-strong);
}
table.standings th.num,table.standings td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.standings tbody tr{
  cursor:pointer;border-bottom:1px solid var(--line);
}
table.standings tbody tr:hover{background:var(--surface-2);}
table.standings td{padding:12px 10px;vertical-align:middle;}
td.rankcol{width:28px;color:var(--ink-mute);font-family:var(--font-display);font-size:15px;}
.teamcell{display:flex;align-items:center;gap:10px;}
.swatch{width:8px;height:26px;border-radius:2px;flex:none;}
.teamname{font-weight:600;font-size:14.5px;}
.teamname .arrow{color:var(--ink-mute);font-weight:400;font-size:12px;margin-left:5px;}
.manager{color:var(--ink-soft);font-size:12.5px;}
.manager.masked{font-style:italic;color:var(--ink-mute);}
td.pct{font-weight:700;font-variant-numeric:tabular-nums;}
.media-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);
  margin-left:6px;vertical-align:middle;
}

.panel-overlay{
  position:fixed;inset:0;background:rgba(10,15,10,0.5);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;z-index:50;
}
.panel{
  background:var(--surface);border-radius:12px;max-width:640px;width:100%;
  padding:26px 26px 28px;border:1px solid var(--line);
}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;}
.panel-title{display:flex;align-items:center;gap:10px;}
.panel-title .swatch{width:10px;height:34px;}
.panel-title h3{font-family:var(--font-display);font-size:22px;margin:0;font-weight:600;}
.panel-close{
  background:none;border:1px solid var(--line-strong);border-radius:8px;color:var(--ink-soft);
  width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1;flex:none;
}
.panel-sub{color:var(--ink-mute);font-size:13px;margin:2px 0 18px;}

.stintlist{list-style:none;margin:0 0 20px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.stintlist li{
  display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;
}
.stintlist li:last-child{border-bottom:none;}
.stintlist .st-team{font-weight:600;}
.stintlist .st-note{color:var(--ink-mute);font-size:11.5px;display:block;font-weight:400;}
.stintlist .st-manager{color:var(--ink-soft);font-size:12.5px;}
.stintlist .st-rec{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

.totalbox{
  display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);
  border-radius:10px;padding:12px 16px;margin-bottom:22px;font-size:13.5px;
}
.totalbox .big{font-family:var(--font-display);font-size:24px;font-weight:600;}

.media-block{border-top:1px solid var(--line);padding-top:16px;}
.media-block h4{font-family:var(--font-display);font-size:14px;font-weight:600;margin:0 0 10px;letter-spacing:0.02em;color:var(--ink-soft);}
.media-eval{margin-bottom:16px;}
.media-eval:last-child{margin-bottom:0;}
.media-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.rankpill{
  background:var(--accent-bg);color:var(--accent-ink);font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:999px;
}
.evaluator{color:var(--ink-mute);font-size:12px;}
.statrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
.statrow b{color:var(--ink);font-weight:600;}
.keyplayers{font-size:12px;color:var(--ink-mute);margin-bottom:8px;}
.media-comment{font-size:13.5px;color:var(--ink-soft);line-height:1.75;white-space:pre-wrap;}
.no-media{color:var(--ink-mute);font-size:13px;font-style:italic;}

.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px;}
.teamcard{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  cursor:pointer;text-align:left;padding:0;
}
.teamcard:hover{border-color:var(--line-strong);}
.teamcard .bar{height:6px;}
.teamcard .body{padding:14px 16px 16px;}
.teamcard .name{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 4px;}
.teamcard .stat{color:var(--ink-mute);font-size:12px;}

.detail-head{display:flex;align-items:center;gap:12px;margin:24px 0 4px;}
.detail-head .swatch{width:10px;height:38px;}
.detail-head h2{font-family:var(--font-display);font-size:26px;margin:0;font-weight:600;}
.backlink{
  background:none;border:none;color:var(--ink-mute);font-size:13px;cursor:pointer;
  padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;
}
.backlink:hover{color:var(--ink);}

.summarystrip{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px;}
.sumcard{background:var(--surface-2);border-radius:10px;padding:10px 16px;min-width:100px;}
.sumcard .lbl{font-size:11px;color:var(--ink-mute);}
.sumcard .val{font-family:var(--font-display);font-size:20px;font-weight:600;}

table.history{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:26px;}
table.history th{text-align:left;font-size:11px;color:var(--ink-mute);font-weight:500;padding:0 10px 8px;border-bottom:1px solid var(--line-strong);}
table.history td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.history tr.clickable{cursor:pointer;}
table.history tr.clickable:hover{background:var(--surface-2);}
table.history td.num{text-align:right;font-variant-numeric:tabular-nums;}
.leaguechip{
  font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);
}

.managerlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.managerchip{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:13px;cursor:pointer;
}
.managerchip:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-bg);}

.searchbox{
  width:100%;max-width:340px;padding:9px 13px;border:1px solid var(--line-strong);
  border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;margin:14px 0 4px;
}
.searchbox:focus{outline:2px solid var(--accent);outline-offset:1px;}
.hint{font-size:12px;color:var(--ink-mute);margin-bottom:16px;}

.sectiontitle{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 0 4px;}
.sectiondesc{color:var(--ink-soft);font-size:13.5px;margin:0 0 4px;}

.titles-section{margin-top:26px;}
.titles-section h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 10px;}
.titlegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
.titlecard{background:var(--surface-2);border-radius:10px;padding:12px 14px;}
.titlecard .ttl-label{font-size:11px;color:var(--ink-mute);margin-bottom:6px;}
.titlecard .ttl-team{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
.titlecard .ttl-team .swatch{width:8px;height:20px;}
.titlecard .ttl-manager{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.titlecard .ttl-manager.masked-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
.titlecard.cancelled{color:var(--ink-mute);font-size:13px;font-style:italic;}

.achievements{margin:14px 0 22px;}
.achievements h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 8px;}
.achv-row{
  display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);
  border-radius:8px;margin-bottom:6px;font-size:13px;
}
.achv-row .achv-badge{
  font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-bg);
  padding:2px 8px;border-radius:6px;
}

.managergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px;}
.managercard{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;cursor:pointer;text-align:left;
}
.managercard:hover{border-color:var(--line-strong);}
.managercard .name{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 4px;}
.managercard .stat{color:var(--ink-mute);font-size:12px;}

.schedule-box{background:var(--surface-2);border-radius:10px;padding:14px 18px;margin:4px 0 22px;}
.schedule-row{display:flex;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.schedule-row:last-child{border-bottom:none;}
.schedule-row .lbl{width:150px;flex:none;color:var(--ink-mute);font-size:12px;padding-top:1px;}
.schedule-row .val{color:var(--ink-soft);}
.schedule-note{margin:8px 0 0;font-size:12px;color:var(--ink-mute);font-style:italic;}

.disclaimer-box{
  background:var(--surface-2);border-radius:10px;padding:12px 16px;
  font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:14px 0 22px;
}
.intro-note{font-size:13px;color:var(--ink-mute);font-style:italic;margin:0 0 18px;}
.cancelled-note{color:var(--ink-mute);font-style:italic;font-size:13.5px;padding:20px 0;}
.award-section{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line);}
.award-section:last-child{border-bottom:none;}
.award-section h4{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0 0 4px;}
.award-subheading{font-size:12px;color:var(--ink-mute);margin:0 0 10px;}
.award-sub{margin-bottom:12px;}
.award-sub:last-child{margin-bottom:0;}
.award-sub-label{font-size:12.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-bg);display:inline-block;padding:2px 9px;border-radius:6px;margin-bottom:6px;}
.award-winner{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:13.5px;flex-wrap:wrap;}
.award-winner .swatch{width:6px;height:14px;border-radius:2px;flex:none;align-self:center;}
.award-winner .wname{font-weight:600;}
.award-winner .wteam{color:var(--ink-mute);font-size:12px;}
.award-winner .wnote{color:var(--ink-mute);font-size:11.5px;}
.award-groupnote{font-size:11.5px;color:var(--ink-mute);font-style:italic;margin:2px 0 0;}
.bestnine-grid{display:flex;flex-direction:column;gap:2px;}

@media (max-width:560px){
  table.standings td{padding:10px 6px;}
  .manager{display:none;}
  .stintlist li{grid-template-columns:1fr auto;}
  .stintlist .st-manager{grid-column:1 / -1;}
  .schedule-row{flex-direction:column;gap:2px;}
  .schedule-row .lbl{width:auto;}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <h1 class="wordmark"><span class="lg">JLL</span>・<span class="lg">JNL</span>球団成績</h1>
    <p class="masthead-note">Roblox HCBBのJLL・JNL両リーグ、球団成績と球団評価のアーカイブ</p>
  </div>
  <p class="masthead-sub">シーズンごとの順位、球団の歴代成績・監督、開幕前メディア評価をまとめて見られます。</p>
</header>

<nav class="tabbar" id="tabbar">
  <button data-view="season">シーズン成績</button>
  <button data-view="teams">球団一覧</button>
  <button data-view="managers">監督</button>
  <button data-view="titles">個人タイトル</button>
</nav>

<main class="page" id="app"></main>

<script>
const TEAMS = {
  tigers:   {name:"タイガース",   color:"#E3B23C"},
  giants:   {name:"ジャイアンツ", color:"#E07B23"},
  baystars: {name:"ベイスターズ", color:"#1F63B0"},
  swallows: {name:"スワローズ",   color:"#2E8B4E"},
  dragons:  {name:"ドラゴンズ",   color:"#4FA3D1"},
  carp:     {name:"カープ",       color:"#D23B2E"},
  hawks:    {name:"ホークス",     color:"#D9A600"},
  lions:    {name:"ライオンズ",   color:"#17264F"},
  fighters: {name:"ファイターズ", color:"#22ABC4"},
  buffaloes:{name:"バッファローズ",color:"#26221E"},
  marines:  {name:"マリーンズ",   color:"#2E3540"},
  eagles:   {name:"イーグルス",   color:"#C1451F"},
  braves:   {name:"ブレーブス",   color:"#E8C24A"},
  phoenix:  {name:"フェニックス",  color:"#C4272C"}
};

function st(team, manager, games, wins, losses, note){
  return {team, manager, games, wins, losses, note: note || null};
}
function ent(id, stints, media){
  return {id, stints, media: media || null};
}

const SEASONS = [
{
  league:"JLL", key:"s1", label:"JLL S1", suspended:false, teamCountNote:"4球団制",
  schedule:{
    regularSeason:"2025年4月28日～6月9日",
    cs:"2025年6月14日～6月17日",
    japanSeries:"2025年6月20日～6月23日",
    allStar:"実施なし"
  },
  champions:{
    leagueChamp:{team:"giants",manager:"daibko"},
    csChamp:{team:"eagles",manager:"amanekkoyumeneko"},
    jsChamp:{team:"giants",manager:"daibko"}
  },
  entries:[
    ent("jll-s1-eagles", [st("eagles","amanekkoyumeneko",30,9,21)], {
      evaluator:"siiitake", rank:"3位予想",
      stats:[["打撃","B-"],["投球","B"],["稼働","B"]],
      comment:"このチームはどれにしてもあと1つ足りないチームとなっている。打者ではbotknが傑出した成績を残しているが、他が続かない。あともう1人傑出したバッターが出れば、大きな力をもったチームとなるだろう。海外選手ではHongthateverything,Roistybt,617mon2と優秀な打撃・投球をこなせる選手を獲得したが、日本人選手がそのアドバンテージを活かしきれてない。序盤は打線が好調で勝ちもついてきている状況だったが、やはり打撃面での課題が多い。投球ではRyryが3勝をあげているが、後半戦も好調を保てれるのかは疑問に思う。日本人選手の打撃が好調になれば、再び返り咲くことも可能であろう。"
    }),
    ent("jll-s1-giants", [st("giants","daibko",30,27,3)], {
      evaluator:"siiitake", rank:"1位予想",
      stats:[["打撃","A"],["投球","S"],["稼働","A+"]],
      comment:"このチームは絶好調である。投手・打撃陣ともにまとまった良いチームをdaibkoは作り上げた。打撃ではsignのkillisameが新人王レベルの活躍を見せ、AriyaGX,Ros5e_0がドラフト選手らしい活躍で打線を牽引している。また、海外選手のAdelie_TRはチームトップの活躍を見せており、存在だけで頼もしい存在となっている。投手ではAPBLでサイ・ヤング賞を獲得したRos5e_0やAriyaGX、海外選手のBeynlord、signのsiiitakeといった強力な投手陣がいて、控えにはqoota_sab2等の投手が控えている。active率も高く、後半戦に大崩れする可能性は低いだろう。"
    }),
    ent("jll-s1-lions", [st("lions","aozoraSKYLINE",30,7,23)], {

const MANAGER_ALIAS = {"9aliu_s":"Akk_HAYATEzZ"};
function canonicalManager(name){
  if(!name) return name;
  return MANAGER_ALIAS[name] || name;
}
function isMasked(name){
  return !!name && name.indexOf("掲載自粛") !== -1;
}

// Known "同一人物" (same real person, different in-game name) pairs noted alongside
// individual title winners, used to connect a title to a manager's achievement history.
const NAME_ALIASES = [
  ["N1ghtGreg","4tvzz"],
  ["Germany_ballpber","fv4xmei"],
  ["G7hcbb","G7cute"],
  ["Royals4ki","Senalirs"],
  ["kanatonotudoi2","kanatononarou"],
  ["9aliu_s","Akk_HAYATEzZ"],
  ["amenekoyumeneko","amanekkoyumeneko"]
];
function aliasGroup(name){
  const group = new Set([name]);
  let changed = true;
  while(changed){
    changed = false;
    NAME_ALIASES.forEach(([a,b])=>{
      if(group.has(a) && !group.has(b)){ group.add(b); changed=true; }
      if(group.has(b) && !group.has(a)){ group.add(a); changed=true; }
    });
  }
  return group;
}

function flattenAwardWinners(data){
  if(!data || data.cancelled) return [];
  const rows = [];
  data.sections.forEach(sec=>{
    if(sec.subs){
      const genericGroup = /タイトル$/.test(sec.heading);
      sec.subs.forEach(sub=>{
        rows.push({label: genericGroup ? sub.label : (sec.heading+"（"+sub.label+"）"), winners: sub.winners});
      });
    } else {
      rows.push({label: sec.heading, winners: sec.winners});
    }
  });
  return rows;
}

function teamAwardRows(league, seasonKey, teamId){
  const data = INDIVIDUAL_TITLES[league+"-"+seasonKey];
  const out = [];
  flattenAwardWinners(data).forEach(row=>{
    row.winners.filter(win=>win.team===teamId).forEach(win=>{
      out.push({label: row.label, name: win.name});
    });
  });
  return out;
}

function managerAwardRows(canonicalName){
  const group = aliasGroup(canonicalName);
  const out = [];
  SEASONS.forEach(season=>{
    const data = INDIVIDUAL_TITLES[season.league+"-"+season.key];
    flattenAwardWinners(data).forEach(row=>{
      row.winners.forEach(win=>{
        if(group.has(win.name)){
          out.push({season, label: row.label, name: win.name, team: win.team, note: win.note});
        }
      });
    });
  });
  return out;
}

function totalOf(stints){
  return stints.reduce((a,s)=>({games:a.games+s.games,wins:a.wins+s.wins,losses:a.losses+s.losses}),{games:0,wins:0,losses:0});
}
function pct(wins,losses){
  const d = wins+losses;
  if(d===0) return "—";
  const v = wins/d;
  return v.toFixed(3).replace(/^0/,"");
}

function teamTitles(teamId){
  const rows = [];
  SEASONS.forEach(season=>{
    const c = season.champions;
    if(!c || c.cancelled) return;
    const titles = [];
    if(c.leagueChamp && c.leagueChamp.team===teamId) titles.push("リーグ優勝");
    if(c.csChamp && c.csChamp.team===teamId) titles.push("CS優勝");
    if(c.jsChamp && c.jsChamp.team===teamId) titles.push("日本シリーズ優勝");
    if(titles.length) rows.push({season, titles});
  });
  return rows;
}

function managerTitles(name){
  const rows = [];
  SEASONS.forEach(season=>{
    const c = season.champions;
    if(!c || c.cancelled) return;
    const titles = [];
    [["leagueChamp","リーグ優勝"],["csChamp","CS優勝"],["jsChamp","日本シリーズ優勝"]].forEach(([key,label])=>{
      const champ = c[key];
      if(champ && !isMasked(champ.manager) && canonicalManager(champ.manager)===name){
        titles.push({label, team:champ.team});
      }
    });
    if(titles.length) rows.push({season, titles});
  });
  return rows;
}

function seasonById(league,key){ return SEASONS.find(s=>s.league===league && s.key===key); }
function entryRank(season, entryId){
  const ranked = rankedEntries(season);
  const idx = ranked.findIndex(e=>e.id===entryId);
  return idx===-1 ? null : idx+1;
}
function rankedEntries(season){
  return season.entries.map(e=>({...e, total: totalOf(e.stints)}))
    .sort((a,b)=>{
      const pa = a.total.wins/(a.total.wins+a.total.losses||1);
      const pb = b.total.wins/(b.total.wins+b.total.losses||1);
      return pb-pa;
    });
}

function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") el.className = attrs[k];
    else if(k==="html") el.innerHTML = attrs[k];
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c === "string" || typeof c === "number") el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}

  const bar = document.getElementById("tabbar");
  [...bar.children].forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.view===state.view);
  });
}

function renderScheduleBox(season){

function openEntryPanel(season, entryId){
  const entry = season.entries.find(e=>e.id===entryId);
  const total = totalOf(entry.stints);
  const last = entry.stints[entry.stints.length-1];
  const team = TEAMS[last.team];
  const rank = entryRank(season, entryId);
  const overlay = h("div",{class:"panel-overlay", onclick:(ev)=>{ if(ev.target===overlay) overlay.remove(); }});
  const panel = h("div",{class:"panel"});
  panel.appendChild(h("div",{class:"panel-head"},
    h("div",{class:"panel-title"},
      h("div",{class:"swatch", style:`background:${team.color}`}),
      h("div",{}, h("h3",{}, team.name), h("p",{class:"panel-sub"}, season.label+" ・ "+rank+"位（"+total.wins+"勝"+total.losses+"敗）"))
    ),
    h("button",{class:"panel-close", onclick:()=>overlay.remove()}, "×")
  ));

  const stintList = h("ul",{class:"stintlist"});
  entry.stints.forEach(s=>{
    const t = TEAMS[s.team];
    stintList.appendChild(h("li",{},
      h("span",{class:"st-team"}, t.name, s.note?h("span",{class:"st-note"},s.note):null),
      h("span",{class:"st-manager"}, isMasked(s.manager)?"※非公開":s.manager+(s.manager && s.manager.indexOf("監督代行")===-1 && false?"":"")),
      h("span",{class:"st-rec"}, s.games+"試合 "+s.wins+"勝"+s.losses+"敗（"+pct(s.wins,s.losses)+"）")
    ));
  });
  panel.appendChild(stintList);

  panel.appendChild(h("div",{class:"totalbox"},
    h("div",{}, h("div",{class:"lbl", style:"font-size:11px;color:var(--ink-mute)"},"通算"), h("div",{class:"big"}, total.games+"試合 "+total.wins+"勝"+total.losses+"敗")),
    h("div",{class:"big"}, pct(total.wins,total.losses))
  ));

  const mediaBlock = h("div",{class:"media-block"});
  mediaBlock.appendChild(h("h4",{},"開幕前メディア評価"));
  if(entry.media){
    mediaBlock.appendChild(renderMediaEval(entry.media));
    if(entry.media.secondary){
      mediaBlock.appendChild(renderMediaEval(entry.media.secondary, true));
    }
  } else {
    mediaBlock.appendChild(h("p",{class:"no-media"},"このチームの評価記事は登録されていません。"));
  }
  panel.appendChild(mediaBlock);

  const teamIdsInEntry = [...new Set(entry.stints.map(s=>s.team))];
  let awardRows = [];
  teamIdsInEntry.forEach(tid=>{ awardRows = awardRows.concat(teamAwardRows(season.league, season.key, tid)); });
  const titleBlock = h("div",{class:"media-block"});
  titleBlock.appendChild(h("h4",{},"個人タイトル受賞者"));
  if(awardRows.length){
    awardRows.forEach(r=>{
      titleBlock.appendChild(h("div",{class:"award-winner"},
        h("span",{class:"wname"}, r.name),
        h("span",{class:"wteam"}, r.label)
      ));
    });
  } else {
    titleBlock.appendChild(h("p",{class:"no-media"},"このチームからの個人タイトル受賞者は登録されていません。"));
  }
  panel.appendChild(titleBlock);

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

function allManagerRows(){
  const set = new Set();
  FLAT.forEach(s=>{
    if(!isMasked(s.manager)) set.add(canonicalManager(s.manager));
  });
  return [...set].map(name=>{
    const stints = FLAT.filter(s=>!isMasked(s.manager) && canonicalManager(s.manager)===name);
    const total = totalOf(stints);
    const winPct = total.wins/(total.wins+total.losses||1);
    return {name, total, winPct};
  }).sort((a,b)=> b.winPct - a.winPct);
}

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

document.getElementById("tabbar").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-view]");
  if(!btn) return;
  state.view = btn.dataset.view;
  render();
});

render();
</script>
</body>
</html>
